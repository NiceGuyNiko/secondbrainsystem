# Automated checks on every push and pull request.
# This workflow has no access to production: it defines no secrets and builds in Demo Mode.
# A Supabase integration job (local Supabase inside the runner: auth, RLS, migrations) is added
# once the base schema migrations from production history are committed.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tests (PGlite database tests included)
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build (Demo Mode, no database settings)
        run: npm run build
